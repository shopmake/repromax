# Render Blueprint — creates the service; you only paste the secret values in the dashboard.
services:
  - type: web
    name: store-backend
    env# Render Blueprint — creates the service; you only paste the secret values in the dashboard.
services:
  - type: web
    name: store-backend
    env: node
    buildCommand: npm install
    startCommand: npm start
    healthCheckPath: /health
    envVars:
      - key: STORE_NAME
        sync: false
      - key: FIREBASE_SERVICE_ACCOUNT_JSON
        sync: false
      - key: ADMIN_SECRET
        sync: false
      - key: TURNSTILE_SECRET_KEY
        sync: false
      - key: RESELLER_API_KEY
        sync: false
      - key: RESELLER_MASTER_KEY
        sync: false
      - key: RESELLER_ENDPOINT
        value: https://repromax5.onrender.com/api/reseller/v1

      # ---- Forgot password (email OTP via Brevo) ----
      - key: BREVO_API_KEY
        sync: false
      - key: BREVO_SENDER_EMAIL      # must be a sender verified in your Brevo account
        sync: false
      - key: BREVO_SENDER_NAME       # optional — defaults to STORE_NAME
        sync: false

      # ---- FF Glory Bot (Basic groups only) ----
      - key: GLORY_API_KEY
        sync: false
      - key: GLORY_MASTER_KEY
        sync: false
      - key: GLORY_BASE_URL            # https://ffglory.pro
        sync: false
      - key: GLORY_PRICE_BASIC_NRP     # 250 — change it in the dashboard any time
        sync: false
      - key: GLORY_MAX_GROUPS_PER_USER # 5
        sync: false
